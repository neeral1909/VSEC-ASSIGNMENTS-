
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Street Scene</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #dff3ff;
        }

        h1 {
            color: #183153;
            padding: 15px;
        }

        .scene {
            position: relative;
            height: 420px;
            overflow: hidden;
            background: linear-gradient(#87ceeb 65%, #b7d99c 65%);
        }

        /* Traffic signal */
        .signal {
            position: absolute;
            top: 25px;
            right: 12%;
            width: 65px;
            padding: 10px;
            background: #292929;
            border-radius: 12px;
            z-index: 2;
        }

        .light {
            width: 45px;
            height: 45px;
            margin: 8px auto;
            border-radius: 50%;
            background: #555;
            animation-duration: 10s;
            animation-iteration-count: infinite;
        }

        .red {
            background: #ff3030;
            animation-name: redLight;
        }

        .yellow {
            background: #555;
            animation-name: yellowLight;
        }

        .green {
            background: #555;
            animation-name: greenLight;
        }

        @keyframes redLight {
            0%, 29.9%, 80%, 100% {
                background: #ff3030;
                box-shadow: 0 0 15px red;
            }
            30%, 79.9% {
                background: #555;
                box-shadow: none;
            }
        }

        @keyframes greenLight {
            0%, 29.9%, 70%, 100% {
                background: #555;
                box-shadow: none;
            }
            30%, 69.9% {
                background: #00e676;
                box-shadow: 0 0 15px lime;
            }
        }

        @keyframes yellowLight {
            0%, 69.9%, 80%, 100% {
                background: #555;
                box-shadow: none;
            }
            70%, 79.9% {
                background: #ffeb3b;
                box-shadow: 0 0 15px yellow;
            }
        }

        .pole {
            position: absolute;
            top: 160px;
            right: calc(12% + 32px);
            width: 12px;
            height: 150px;
            background: #555;
        }

        /* Road */
        .road {
            position: absolute;
            bottom: 0;
            height: 110px;
            width: 100%;
            background: #454545;
        }

        .road-line {
            position: absolute;
            top: 52px;
            width: 100%;
            border-top: 5px dashed white;
        }

        /* Car body and circular wheels */
        .car {
            position: absolute;
            bottom: 48px;
            left: 20px;
            width: 110px;
            height: 45px;
            background: #1976d2;
            border-radius: 10px 15px 5px 5px;
            animation: moveCar 10s linear infinite;
            z-index: 1;
        }

        .window {
            position: absolute;
            top: -22px;
            left: 25px;
            width: 55px;
            height: 25px;
            background: #1976d2;
            border: 3px solid #333;
            border-radius: 10px 10px 0 0;
        }

        .wheel {
            position: absolute;
            bottom: -10px;
            width: 24px;
            height: 24px;
            background: #111;
            border: 3px solid #ddd;
            border-radius: 50%;
        }

        .wheel1 {
            left: 12px;
        }

        .wheel2 {
            right: 12px;
        }

        /* Car moves only while green is on */
        @keyframes moveCar {
            0%, 29.9% {
                transform: translateX(0);
            }
            30% {
                transform: translateX(0);
            }
            70% {
                transform: translateX(calc(100vw - 180px));
            }
            70.1%, 100% {
                transform: translateX(calc(100vw - 180px));
            }
        }

        footer {
            padding: 15px;
            color: #183153;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🚦 Animated Street Scene 🚗</h1>

    <div class="scene">

        <div class="signal">
            <div class="light red"></div>
            <div class="light yellow"></div>
            <div class="light green"></div>
        </div>

        <div class="pole"></div>

        <div class="road">
            <div class="road-line"></div>
        </div>

        <div class="car">
            <div class="window"></div>
            <div class="wheel wheel1"></div>
            <div class="wheel wheel2"></div>
        </div>

    </div>

    <footer>
        Red = Stop | Green = Go | Yellow = Caution
    </footer>

</body>
</html>
